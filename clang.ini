# Pin the toolchain to clang (see meson.build's force-clang guard).
#
# Usage: meson setup <builddir> --native-file clang.ini
#
# Why: the engine does not compile with GCC on x86 (float16_t is __fp16,
# clang-only syntax there), and a bare `meson setup` on systems where
# c++ resolves to GCC (e.g. via ccache) fails deep in types.hpp with a
# confusing "'__fp16' does not name a type" error. This file makes the
# supported toolchain explicit.

[binaries]
c = ['clang']
cpp = ['clang++']
