name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (portable x86-64-v3)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq clang ninja-build
          python3 -m pip install meson

      - name: Setup build (portable x86-64-v3)
        run: |
          meson setup build-ci --native-file clang.ini -Dcpu_arch=x86-64-v3

      - name: Build
        run: ninja -C build-ci

      - name: Test
        run: meson test -C build-ci --print-errorlogs
